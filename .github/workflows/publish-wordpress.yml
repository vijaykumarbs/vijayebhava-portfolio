name: Publish WordPress posts

on:
  push:
    branches:
      - main
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wordpress-posts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read published WordPress posts
        id: feed
        env:
          WORDPRESS_URL: https://cms.vijayebhava.com
        run: |
          curl --fail --silent --show-error --retry 2 --retry-delay 3 \
            "$WORDPRESS_URL/wp-json/wp/v2/posts?status=publish&per_page=100&orderby=date&order=desc&_fields=id%2Cslug%2Cmodified" \
            --output "$RUNNER_TEMP/wordpress-posts.json"
          hash="$(sha256sum "$RUNNER_TEMP/wordpress-posts.json" | cut -d ' ' -f 1)"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Skip when the feed has not changed
        id: changes
        env:
          FEED_HASH: ${{ steps.feed.outputs.hash }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin codex/hostinger-static
          latest="$(git log -1 --format=%s refs/remotes/origin/codex/hostinger-static)"
          if [ "$latest" = "Publish WordPress feed: $FEED_HASH source: $SOURCE_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Published posts have not changed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Published posts changed; rebuilding the site."
          fi

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: npm ci

      - name: Build the site
        if: steps.changes.outputs.changed == 'true'
        env:
          WORDPRESS_URL: https://cms.vijayebhava.com
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-EK0TS9LYBC
        run: npm run build

      - name: Publish to Hostinger
        if: steps.changes.outputs.changed == 'true'
        env:
          FEED_HASH: ${{ steps.feed.outputs.hash }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          deploy_dir="$(mktemp -d)"
          git worktree add --detach "$deploy_dir" refs/remotes/origin/codex/hostinger-static
          rsync -a --delete --exclude='.git' out/ "$deploy_dir/"
          git -C "$deploy_dir" config user.name "github-actions[bot]"
          git -C "$deploy_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$deploy_dir" add -A
          if git -C "$deploy_dir" diff --cached --quiet; then
            echo "The generated site is already current."
          else
            git -C "$deploy_dir" commit -m "Publish WordPress feed: $FEED_HASH source: $SOURCE_SHA"
            git -C "$deploy_dir" push origin HEAD:refs/heads/codex/hostinger-static
          fi
