name: Publish blog post

on:
  workflow_dispatch:
    inputs:
      markdown:
        description: Complete Markdown article, including YAML frontmatter (maximum 60,000 bytes)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: blog-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require the production branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Run this publisher from the main branch." >&2
          exit 1

      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 22
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create the Markdown file
        id: post
        env:
          POST_MARKDOWN: ${{ inputs.markdown }}
        run: |
          file_name="$(node scripts/prepare-blog-post.mjs)"
          echo "file_name=$file_name" >> "$GITHUB_OUTPUT"

      - name: Validate the article and build the static site
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm run check:output

      - name: Commit and push the article
        env:
          FILE_NAME: ${{ steps.post.outputs.file_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "content/blog/$FILE_NAME"
          if git diff --cached --quiet; then
            echo "No new article was staged." >&2
            exit 1
          fi
          git commit -m "Publish blog post: ${FILE_NAME%.md}"
          git push origin HEAD:main
